<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>t2 — Сила твоего слова</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --tele2-pink: #ff3495;
      --tele2-pink-hover: #ff1a87;
      --tele2-mint: #00e599;
      --tele2-cyan: #00c2ff;
      --tele2-lime: #c6ff00;

      --app-bg: #09090b;
      --app-surface: #141418;
      --app-surface-elevated: #1c1c22;
      --app-border: #27272f;
      --app-text: #ffffff;
      --app-text-muted: #a1a1aa;
      --app-nav-bg: rgba(9, 9, 11, 0.92);
      --app-chip-bg: #18181e;
      --app-chip-text: #d4d4d8;
      --app-chip-border-hover: #3f3f4a;
      --app-input-bg: #141418;

      --radius-lg: 1rem;
      --radius-xl: 1.25rem;
      --radius-2xl: 1.5rem;
      --radius-3xl: 1.75rem;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body[data-theme='light'] {
      --app-bg: #f4f4f6;
      --app-surface: #ffffff;
      --app-surface-elevated: #fafafc;
      --app-border: #e4e4e7;
      --app-text: #09090b;
      --app-text-muted: #52525b;
      --app-nav-bg: rgba(255, 255, 255, 0.92);
      --app-chip-bg: #ffffff;
      --app-chip-text: #27272a;
      --app-chip-border-hover: #a1a1aa;
      --app-input-bg: #ffffff;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100dvh;
      font-family: var(--font-sans);
      background-color: var(--app-bg);
      color: var(--app-text);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    button,
    input {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    ::selection {
      background: var(--tele2-pink);
      color: #ffffff;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .app-viewport {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100dvh;
      background: var(--app-bg);
      color: var(--app-text);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .app-glow {
      position: fixed;
      inset: 0 0 auto 0;
      height: 14rem;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .app-glow::before {
      content: '';
      display: block;
      max-width: 70rem;
      height: 100%;
      margin: 0 auto;
      opacity: 0.25;
      filter: blur(48px);
      background:
        radial-gradient(circle at 20% 20%, #ff3495 0%, transparent 55%),
        radial-gradient(circle at 85% 15%, #00c2ff 0%, transparent 50%);
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      flex-shrink: 0;
      background: var(--app-nav-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--app-border);
    }

    .header-inner {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.7rem 1rem;
    }

    .brand-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background: transparent;
      border: none;
      padding: 0;
      color: inherit;
      cursor: pointer;
      text-align: left;
    }

    .brand-badge {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 13px;
      background: var(--app-surface-elevated);
      border: 1px solid var(--app-border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 2px;
      border-radius: 11px;
      display: none;
    }

    body[data-theme='dark'] .logo-for-dark,
    :root:not([data-theme='light']) body:not([data-theme='light']) .logo-for-dark {
      display: block;
    }

    body[data-theme='light'] .logo-for-light {
      display: block;
    }

    .brand-meta {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .theme-toggle-btn {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--app-border);
      background: var(--app-surface);
      transition: transform 0.15s, border-color 0.2s;
    }

    .theme-toggle-btn:hover {
      border-color: var(--tele2-pink);
    }

    .theme-toggle-btn:active {
      transform: scale(0.9);
    }

    .app-main {
      position: relative;
      z-index: 10;
      flex: 1;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 1rem 1rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .app-main > * {
      flex-shrink: 0;
    }

    .hero-card {
      position: relative;
      flex-shrink: 0;
      overflow: hidden;
      border-radius: var(--radius-3xl);
      background: #000000;
      color: #ffffff;
      padding: 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 22px 45px rgba(0, 0, 0, 0.35);
    }

    .hero-blob-1 {
      position: absolute;
      right: -2.5rem;
      top: -3rem;
      width: 13rem;
      height: 13rem;
      border-radius: 9999px;
      opacity: 0.4;
      filter: blur(40px);
      background: linear-gradient(135deg, #ff3495, #00c2ff);
      pointer-events: none;
    }

    .hero-blob-2 {
      position: absolute;
      left: -3rem;
      bottom: -3.5rem;
      width: 11rem;
      height: 11rem;
      border-radius: 9999px;
      opacity: 0.25;
      filter: blur(40px);
      background: linear-gradient(135deg, #c6ff00, #00e599);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 0.95rem;
    }

    .hero-heading-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .hero-title {
      font-size: 1.72rem;
      font-weight: 900;
      line-height: 1.03;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }

    .hero-title .accent-pink {
      color: var(--tele2-pink);
    }

    .instruction-box {
      border-radius: var(--radius-xl);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .instruction-step {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
    }

    .step-num {
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 0.1rem;
      font-size: 0.75rem;
      font-weight: 900;
      background: #ffffff;
      color: #000000;
    }

    .step-text {
      font-size: 0.76rem;
      line-height: 1.4;
      font-weight: 600;
      color: #f4f4f5;
    }

    .random-card {
      border-radius: var(--radius-3xl);
      border: 1px solid var(--app-border);
      background: var(--app-surface);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .random-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .random-title-wrap {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .random-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 9999px;
      background: var(--tele2-pink);
      box-shadow: 0 0 10px rgba(255, 52, 149, 0.7);
    }

    .random-title {
      font-size: 0.85rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .random-shuffle-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 0.75rem;
      border-radius: 0.75rem;
      background: var(--tele2-pink);
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 800;
      box-shadow: 0 6px 16px rgba(255, 52, 149, 0.32);
      transition: background 0.2s, transform 0.15s;
    }

    .random-shuffle-btn:hover {
      background: var(--tele2-pink-hover);
    }

    .random-shuffle-btn:active {
      transform: scale(0.95);
    }

    .random-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.55rem;
    }

    .random-word-btn {
      position: relative;
      overflow: hidden;
      text-align: left;
      padding: 0.75rem 0.8rem;
      border-radius: var(--radius-xl);
      border: 1px solid var(--app-border);
      background: var(--app-surface-elevated);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      transition: border-color 0.2s, transform 0.15s;
      animation: tele2WordPop 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .random-word-btn:hover {
      border-color: var(--tele2-pink);
    }

    .random-word-btn:active {
      transform: scale(0.97);
    }

    .random-word-cat {
      font-size: 0.6rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .random-word-name {
      font-size: 0.98rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--app-text);
    }

    .search-box {
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: #71717a;
      pointer-events: none;
      display: flex;
    }

    .search-input {
      width: 100%;
      height: 2.75rem;
      padding: 0 2.5rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--app-border);
      background: var(--app-input-bg);
      color: var(--app-text);
      font-size: 0.875rem;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input::placeholder {
      color: #71717a;
    }

    .search-input:focus {
      border-color: var(--tele2-pink);
      box-shadow: 0 0 0 2px rgba(255, 52, 149, 0.35);
    }

    .search-clear {
      position: absolute;
      right: 0.45rem;
      top: 50%;
      transform: translateY(-50%);
      width: 2rem;
      height: 2rem;
      display: none;
      align-items: center;
      justify-content: center;
      color: #71717a;
      border-radius: 9999px;
    }

    .search-clear.is-visible {
      display: inline-flex;
    }

    .search-clear:hover {
      color: var(--tele2-pink);
    }

    .filter-strip {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow-x: auto;
      padding: 0 1rem 0.25rem;
      margin: 0 -1rem;
    }

    .filter-chip {
      flex-shrink: 0;
      height: 2.5rem;
      padding: 0 0.85rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--app-border);
      background: var(--app-chip-bg);
      color: var(--app-chip-text);
      font-size: 0.75rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: transform 0.15s, border-color 0.2s, background 0.2s;
    }

    .filter-chip:hover {
      border-color: var(--app-chip-border-hover);
    }

    .filter-chip:active {
      transform: scale(0.95);
    }

    .chip-count {
      font-size: 0.65rem;
      padding: 0.15rem 0.38rem;
      border-radius: 0.4rem;
      background: rgba(113, 113, 122, 0.18);
    }

    .category-banner {
      display: none;
      border-radius: var(--radius-3xl);
      padding: 1rem;
      border: 1px solid var(--app-border);
      background: var(--app-surface);
    }

    .category-banner.is-visible {
      display: block;
    }

    .category-banner-inner {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .category-icon-box {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .category-banner-title-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .category-banner-title {
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .category-banner-tag {
      font-size: 0.58rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 0.18rem 0.48rem;
      border-radius: 0.45rem;
    }

    .category-banner-desc {
      margin-top: 0.25rem;
      font-size: 0.76rem;
      line-height: 1.45;
      color: var(--app-text-muted);
    }

    .words-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }

    .word-card {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-3xl);
      padding: 1rem;
      border: 1px solid var(--app-border);
      background: var(--app-surface);
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      cursor: pointer;
      transition: transform 0.18s, border-color 0.2s, box-shadow 0.2s;
    }

    .word-card:hover {
      border-color: rgba(255, 52, 149, 0.65);
    }

    .word-card:active {
      transform: scale(0.98);
    }

    .word-card-accent {
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      opacity: 0.92;
    }

    .word-card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.45rem;
      padding-top: 0.15rem;
    }

    .word-cat-pill {
      display: inline-flex;
      align-items: center;
      font-size: 0.625rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.22rem 0.6rem;
      border-radius: 0.55rem;
    }

    .word-tag {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--app-text-muted);
    }

    .word-mic-hint {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--tele2-pink);
    }

    .word-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .word-title {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      transition: color 0.2s;
    }

    .word-card:hover .word-title {
      color: var(--tele2-pink);
    }

    .word-meaning {
      font-size: 0.77rem;
      line-height: 1.48;
      color: var(--app-text-muted);
    }

    .empty-state {
      border-radius: var(--radius-3xl);
      border: 1px solid var(--app-border);
      background: var(--app-surface);
      padding: 2rem 1.25rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
    }

    .empty-icon {
      width: 3rem;
      height: 3rem;
      border-radius: 1rem;
      background: rgba(255, 52, 149, 0.15);
      color: var(--tele2-pink);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-reset-btn {
      margin-top: 0.25rem;
      padding: 0.55rem 1rem;
      border-radius: 0.75rem;
      background: var(--tele2-pink);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .app-footer {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 1.25rem 1rem calc(1.75rem + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--app-border);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .tele2-footer-link {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.8rem;
      font-weight: 800;
      text-decoration: none;
      color: var(--app-text-muted);
      padding: 0.55rem 1.1rem;
      border-radius: 9999px;
      border: 1px solid var(--app-border);
      background: var(--app-surface);
      transition: color 0.2s, border-color 0.2s, transform 0.15s;
    }

    .tele2-footer-link:hover {
      color: var(--tele2-pink);
      border-color: var(--tele2-pink);
    }

    .tele2-footer-link:active {
      transform: scale(0.97);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .modal-backdrop.is-open {
      display: flex;
    }

    .modal-sheet {
      position: relative;
      width: 100%;
      max-width: 480px;
      max-height: 88dvh;
      overflow-y: auto;
      border-radius: 2rem 2rem 0 0;
      border-top: 1px solid var(--app-border);
      background: var(--app-surface);
      padding: 1.5rem 1.35rem calc(2rem + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
      box-shadow: 0 -20px 50px rgba(0, 0, 0, 0.6);
      animation: sheetSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-sheet > * {
      flex-shrink: 0;
    }

    .sheet-handle {
      width: 2.5rem;
      height: 0.25rem;
      border-radius: 9999px;
      background: rgba(113, 113, 122, 0.4);
      margin: -0.5rem auto 0;
    }

    .modal-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .modal-tags {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .modal-close-btn {
      width: 2rem;
      height: 2rem;
      border-radius: 9999px;
      border: 1px solid var(--app-border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s;
    }

    .modal-close-btn:hover {
      border-color: var(--tele2-pink);
    }

    .anim-stage {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-3xl);
      padding: 3rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .anim-word {
      position: relative;
      font-size: 2.1rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }

    .modal-meaning {
      font-size: 0.875rem;
      line-height: 1.55;
      text-align: center;
      color: var(--app-text-muted);
    }

    .related-section {
      padding-top: 1rem;
      border-top: 1px solid var(--app-border);
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .related-title {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-align: center;
      color: var(--app-text-muted);
    }

    .related-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
    }

    .related-pill {
      padding: 0.45rem 0.75rem;
      border-radius: 0.75rem;
      font-size: 0.75rem;
      font-weight: 700;
      border: 1px solid var(--app-border);
      background: var(--app-surface-elevated);
      color: var(--app-text);
      transition: border-color 0.2s, transform 0.15s;
    }

    .related-pill:hover {
      border-color: var(--tele2-pink);
    }

    .related-pill:active {
      transform: scale(0.95);
    }

    @media (min-width: 640px) {
      .header-inner {
        padding: 0.85rem 1.5rem;
      }

      .app-main {
        padding: 1.5rem 1.5rem 2.5rem;
        gap: 1.25rem;
      }

      .app-footer {
        padding: 1.5rem 1.5rem 2.25rem;
      }

      return hex;
    }

    function renderTheme() {
      document.body.setAttribute('data-theme', state.darkMode ? 'dark' : 'light');
      dom.headerThemeBtn.innerHTML = state.darkMode ? ICONS.sun : ICONS.moon;

      renderRandomWords();
      renderFilters();
      renderCategoryBanner();
      renderWords();
      if (state.activeWord) renderModal();
    }

    function pickRandomWords() {
      const prevIds = new Set(state.randomWords.map((w) => w.id));
      state.randomWords = CATEGORIES.map((cat) => {
        const groupWords = WORDS.filter((w) => w.categoryId === cat.id);
        const candidates = groupWords.filter((w) => !prevIds.has(w.id));
        const pool = candidates.length > 0 ? candidates : groupWords;
        return pool[Math.floor(Math.random() * pool.length)];
      });
    }

    function renderRandomWords() {
      dom.randomWordsGrid.innerHTML = state.randomWords
        .map((item) => {
          const cat = categoryMap[item.categoryId];
          const displayAccent = getDisplayAccent(cat.accent);
          return `
            <button
              type="button"
              class="random-word-btn"
              data-random-id="${item.id}"
              style="border-top: 3px solid ${cat.accent};"
            >
              <span class="random-word-cat" style="color:${displayAccent};">${cat.name}</span>
              <span class="random-word-name">${item.word}</span>
            </button>
          `;
        })
        .join('');
    }

    function renderFilters() {
      const counts = { all: WORDS.length };
      CATEGORIES.forEach((cat) => {
        counts[cat.id] = WORDS.filter((w) => w.categoryId === cat.id).length;
      });

      const allActive = state.selectedCategory === 'all';
      let html = `
        <button
          type="button"
          class="filter-chip"
          data-cat="all"
          style="${
            allActive
              ? 'background:#ff3495;border-color:#ff3495;color:#ffffff;box-shadow:0 6px 16px rgba(255,52,149,0.32);'
              : ''
          }"
        >
          <span>Все</span>
          <span class="chip-count" style="${
            allActive ? 'background:rgba(0,0,0,0.2);color:#ffffff;' : ''
          }">${counts.all}</span>
        </button>
      `;

      CATEGORIES.forEach((cat) => {
        const isActive = state.selectedCategory === cat.id;
        const isLime = cat.accent.toLowerCase() === '#c6ff00';
        const activeStyle = isActive
          ? `background:${cat.accent};border-color:${cat.accent};color:${
              isLime ? '#09090b' : '#ffffff'
            };box-shadow:0 6px 16px ${cat.accentSoft};`
          : '';
        const countStyle = isActive
          ? `background:rgba(0,0,0,${isLime ? '0.15' : '0.2'});color:${
              isLime ? '#09090b' : '#ffffff'
            };`
          : '';

        html += `
          <button type="button" class="filter-chip" data-cat="${cat.id}" style="${activeStyle}">
            ${ICONS[cat.id]}
            <span>${cat.name}</span>
            <span class="chip-count" style="${countStyle}">${counts[cat.id]}</span>
          </button>
        `;
      });

      dom.filterStrip.innerHTML = html;
    }

    function renderCategoryBanner() {
      if (state.selectedCategory === 'all') {
        dom.categoryBanner.classList.remove('is-visible');
        dom.categoryBanner.innerHTML = '';
        return;
      }

      const cat = categoryMap[state.selectedCategory];
      if (!cat) return;

      const accentColor = getDisplayAccent(cat.accent);
      dom.categoryBanner.classList.add('is-visible');
      dom.categoryBanner.innerHTML = `
        <div class="category-banner-inner">
          <div class="category-icon-box" style="background:${cat.accentSoft};color:${accentColor};">
            ${ICONS[cat.id]}
          </div>
          <div>
            <div class="category-banner-title-row">
              <h2 class="category-banner-title">${cat.name}</h2>
              <span class="category-banner-tag" style="background:${cat.accentSoft};color:${accentColor};">
                ${cat.badgeText}
              </span>
            </div>
            <p class="category-banner-desc">${cat.description}</p>
          </div>
        </div>
      `;
    }

    function renderWords() {
      const query = state.searchQuery.trim().toLowerCase();
      const filtered = WORDS.filter((item) => {
        if (state.selectedCategory !== 'all' && item.categoryId !== state.selectedCategory) {
          return false;
        }
        if (!query) return true;
        const catName = categoryMap[item.categoryId]?.name.toLowerCase() || '';
        return (
          item.word.toLowerCase().includes(query) ||
          item.tag.toLowerCase().includes(query) ||
          item.meaning.toLowerCase().includes(query) ||
          catName.includes(query)
        );
      });

      if (filtered.length === 0) {
        dom.wordsGrid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-icon">${ICONS.search}</div>
            <h3 style="font-size:1rem;font-weight:800;">Слово не найдено</h3>
            <p style="font-size:0.78rem;color:var(--app-text-muted);">
              Попробуйте сбросить поиск или выбрать другую группу.
            </p>
            <button type="button" id="emptyResetBtn" class="empty-reset-btn">
              Показать все слова
            </button>
          </div>
        `;
        const resetBtn = document.getElementById('emptyResetBtn');
        if (resetBtn) {
          resetBtn.addEventListener('click', resetFilters);
        }
        return;
      }

      dom.wordsGrid.innerHTML = filtered
        .map((item) => {
          const cat = categoryMap[item.categoryId];
          const displayAccent = getDisplayAccent(cat.accent);
          return `
            <article
              class="word-card"
              data-word-id="${item.id}"
              role="button"
              tabindex="0"
              aria-label="Запустить анимацию слова ${item.word}"
            >
              <div class="word-card-accent" style="background:${cat.accent};"></div>
              <div class="word-card-meta">
                <span class="word-cat-pill" style="background:${cat.accentSoft};color:${displayAccent};">
                  ${cat.name}
                </span>
                <span class="word-tag">#${item.tag}</span>
              </div>
              <div class="word-title-row">
                <h3 class="word-title">${item.word}</h3>
              </div>
              <p class="word-meaning">${item.meaning}</p>
            </article>
          `;
        })
        .join('');
    }

    function renderModal() {
      const wordItem = state.activeWord;
      if (!wordItem) {
        dom.wordModal.classList.remove('is-open');
        dom.wordModal.setAttribute('aria-hidden', 'true');
        return;
      }

      const cat = categoryMap[wordItem.categoryId];
      const displayAccent = getDisplayAccent(cat.accent);
      const stageTextColor = '#ffffff';

      const related = WORDS.filter(
        (w) => w.categoryId === wordItem.categoryId && w.id !== wordItem.id
      ).slice(0, 4);

      dom.wordModalSheet.innerHTML = `
        <div class="sheet-handle"></div>

        <div class="modal-top-row">
          <div class="modal-tags">
            <span class="word-cat-pill" style="background:${cat.accentSoft};color:${displayAccent};">
              ${cat.name}
            </span>
            <span class="word-tag">#${wordItem.tag}</span>
            <span class="word-mic-hint">• Скажите в микрофон</span>
          </div>
          <button type="button" id="modalCloseBtn" class="modal-close-btn" aria-label="Закрыть">
            ${ICONS.close}
          </button>
        </div>

        <div class="anim-stage" style="background:${cat.accent};">
          <h2 class="anim-word" style="color:${stageTextColor};">${wordItem.word}</h2>
        </div>

        <p class="modal-meaning">${wordItem.meaning}</p>

        <div class="related-section">
          <span class="related-title">Скажи ещё из группы «${cat.name}»</span>
          <div class="related-list">
            ${related
              .map(
                (rw) => `
                <button type="button" class="related-pill" data-related-id="${rw.id}">
                  ${rw.word}
                </button>
              `
              )
              .join('')}
          </div>
        </div>
      `;

      dom.wordModal.classList.add('is-open');
      dom.wordModal.setAttribute('aria-hidden', 'false');
    }

    function resetFilters() {
      state.selectedCategory = 'all';
      state.searchQuery = '';
      dom.searchInput.value = '';
      dom.searchClearBtn.classList.remove('is-visible');
      renderFilters();
      renderCategoryBanner();
      renderWords();
    }

    function bindEvents() {
      dom.headerThemeBtn.addEventListener('click', () => {
        state.darkMode = !state.darkMode;
        renderTheme();
      });

      dom.brandResetBtn.addEventListener('click', resetFilters);

      dom.shuffleWordsBtn.addEventListener('click', () => {
        pickRandomWords();
        renderRandomWords();
      });

      dom.randomWordsGrid.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-random-id]');
        if (!btn) return;
        const found = WORDS.find((w) => w.id === btn.dataset.randomId);
        if (found) {
          state.activeWord = found;
          renderModal();
        }
      });

      dom.searchInput.addEventListener('input', (e) => {
        state.searchQuery = e.target.value;
        dom.searchClearBtn.classList.toggle('is-visible', state.searchQuery.length > 0);
        renderWords();
      });

      dom.searchClearBtn.addEventListener('click', () => {
        state.searchQuery = '';
        dom.searchInput.value = '';
        dom.searchClearBtn.classList.remove('is-visible');
        dom.searchInput.focus();
        renderWords();
      });

      dom.filterStrip.addEventListener('click', (e) => {
        const chip = e.target.closest('[data-cat]');
        if (!chip) return;
        state.selectedCategory = chip.dataset.cat;
        renderFilters();
        renderCategoryBanner();
        renderWords();
      });

      dom.wordsGrid.addEventListener('click', (e) => {
        const card = e.target.closest('[data-word-id]');
        if (!card) return;
        const found = WORDS.find((w) => w.id === card.dataset.wordId);
        if (found) {
          state.activeWord = found;
          renderModal();
        }
      });

      dom.wordsGrid.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const card = e.target.closest('[data-word-id]');
        if (!card) return;
        e.preventDefault();
        const found = WORDS.find((w) => w.id === card.dataset.wordId);
        if (found) {
          state.activeWord = found;
          renderModal();
        }
      });

      dom.wordModal.addEventListener('click', (e) => {
        if (e.target === dom.wordModal || e.target.closest('#modalCloseBtn')) {
          state.activeWord = null;
          renderModal();
          return;
        }
        const relBtn = e.target.closest('[data-related-id]');
        if (relBtn) {
          const found = WORDS.find((w) => w.id === relBtn.dataset.relatedId);
          if (found) {
            state.activeWord = found;
            renderModal();
          }
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && state.activeWord) {
          state.activeWord = null;
          renderModal();
        }
      });
    }

    function init() {
      pickRandomWords();
      renderTheme();
      bindEvents();
    }

    init();
  </script>
</body>
</html>
